<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolutionssimulatorn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-container">
        <h1>Evolutionssimulatorn</h1>
        <p>Av Rut Weilander</p>
        <a href="sim.html">Starta spelet</a>
        <br><br>
        <h3>Inställningar</h3>
        <div id="settings-div">
            <div>
                <p><b>Färgschema</b></p>
                <input type="radio" id="color1" name="colorScheme" value="seafloor">
                <label for="color1">Havsbotten</label>
                <br>
                <input type="radio" id="color2" name="colorScheme" value="desert">
                <label for="color2">Öken</label>
                <br>
                <input type="radio" id="color3" name="colorScheme" value="rainbow">
                <label for="color3">Regnbåge</label>
                <br>
                <input type="radio" id="color4" name="colorScheme" value="forest">
                <label for="color4">Skog</label>
            </div>

            <div>
                <p><b>Tidsframflyttning</b></p>
            </div>

            <div>
                <p><b>Svårighetsgrad</b></p>
            </div>
        </div>

    </div>

    <script src="settings.js"></script>
    
</body>
</html>
